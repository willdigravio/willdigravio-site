backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "writing"
    label: "Writing"
    files:
      - label: "Writing Page"
        name: "writing"
        file: "_data/writing.json"
        fields:
          - label: "Intro text"
            name: "intro"
            widget: "string"
          - label: "Articles"
            name: "articles"
            widget: "list"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Publication", name: "pub", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

  - name: "research"
    label: "Research Services"
    files:
      - label: "Research Page"
        name: "research"
        file: "_data/research.json"
        fields:
          - label: "Intro paragraph 1"
            name: "intro1"
            widget: "text"
          - label: "Intro paragraph 2"
            name: "intro2"
            widget: "text"
          - label: "Specialities"
            name: "specialities"
            widget: "list"
            field: {label: "Item", name: "item", widget: "string"}
          - label: "Available for"
            name: "available"
            widget: "list"
            field: {label: "Item", name: "item", widget: "string"}

  - name: "pages"
    label: "Pages"
    files:
      - label: "Homepage"
        name: "home"
        file: "_data/home.json"
        fields:
          - {label: "Bio", name: "bio", widget: "text"}
      - label: "About"
        name: "about"
        file: "_data/about.json"
        fields:
          - label: "About text"
            name: "text"
            widget: "text"
          - label: "Facts"
            name: "facts"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
      - label: "Scholarship"
        name: "scholarship"
        file: "_data/scholarship.json"
        fields:
          - label: "Scholarship text"
            name: "text"
            widget: "text"
          - label: "Facts"
            name: "facts"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Value", name: "value", widget: "string"}
      - label: "Contact"
        name: "contact"
        file: "_data/contact.json"
        fields:
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Blurb", name: "blurb", widget: "text"}
