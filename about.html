<div class="page-body">
  <div class="sec-head"><span class="sec-num">04</span><h2>About</h2></div>
  <div class="two-col fade">
    <div class="prose" id="about-text"></div>
    <div class="facts" id="about-facts"></div>
  </div>
</div>

<footer>
  <p>Will DiGravio</p>
  <p id="footer-year"></p>
</footer>

<script src="shared.js"></script>
<script>
const d=getData();
document.getElementById('footer-year').textContent=new Date().getFullYear();
document.getElementById('about-text').innerHTML=(d.aboutText||DEFAULT.aboutText).split('\n\n').map(p=>`<p>${p}</p>`).join('');
document.getElementById('about-facts').innerHTML=(d.aboutFacts||DEFAULT.aboutFacts).map(f=>
  `<div class="fact-row"><span class="fact-label">${f.label}</span><span class="fact-value">${f.value}</span></div>`
).join('');
setTimeout(()=>{const o=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in')})},{threshold:0.1});document.querySelectorAll('.fade').forEach(el=>o.observe(el))},100);
</script>
<script>if(window.netlifyIdentity){window.netlifyIdentity.on("init",user=>{if(!user){window.netlifyIdentity.on("login",()=>{document.location.href="/admin/"})}})})</script>
</body>
