<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact — Will DiGravio</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<nav>
  <a class="nav-name" href="index.html">Will DiGravio</a>
  <ul class="nav-links">
    <li><a href="work.html">Work</a></li>
    <li><a href="writing.html">Writing</a></li>
    <li><a href="scholarship.html">Scholarship</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<div class="page-body">
  <div class="contact-inner fade">
    <h2>Let's work together.</h2>
    <p id="contact-blurb"></p>
    <a id="contact-btn" href="#" class="btn"></a>
  </div>
</div>

<footer>
  <p>Will DiGravio</p>
  <p id="footer-year"></p>
</footer>

<script src="shared.js"></script>
<script>
const d=getData();
document.getElementById('footer-year').textContent=new Date().getFullYear();
document.getElementById('contact-blurb').textContent=d.contactBlurb||DEFAULT.contactBlurb;
document.getElementById('contact-btn').href='mailto:'+(d.contactEmail||DEFAULT.contactEmail);
document.getElementById('contact-btn').textContent=d.contactEmail||DEFAULT.contactEmail;
setTimeout(()=>{const o=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in')})},{threshold:0.1});document.querySelectorAll('.fade').forEach(el=>o.observe(el))},100);
</script>
<script>if(window.netlifyIdentity){window.netlifyIdentity.on("init",user=>{if(!user){window.netlifyIdentity.on("login",()=>{document.location.href="/admin/"})}})})</script>
</body>
</html>
